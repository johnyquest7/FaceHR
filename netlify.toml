[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Global security & camera permission headers
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for content-hashed Vite build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-term caching for bundled MediaPipe WASM runtime files
[[headers]]
  for = "/mediapipe/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Always revalidate PWA service worker & manifest so updates roll out cleanly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# SPA client-side routing fallback (existing static files are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
